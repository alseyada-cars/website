<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض السيادة - سيارات ومحركات</title>
    <style>
        body { font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        
        /* تفعيل الخلفية برابط مباشر */
        .hero-section {
            background-image: url('File_000000003d78724399fb804a8defa1f2.png');
            background-size: cover;
            background-position: center;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            text-align: center;
        }

        .section-title { text-align: center; padding: 20px; font-size: 2rem; color: #d4af37; }
        
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding: 20px; }
        
        .car-card { border: 1px solid #ddd; border-radius: 10px; padding: 15px; }
        
        /* التحكم بالصور لمنع التكرار */
        .car-img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body>

    <section class="hero-section">
        <h1>السيادة لتجارة السيارات والمحركات</h1>
    </section>

    <!-- قسم الصالة (الصور المخصصة فقط) -->
    <h2 class="section-title">صالة العرض</h2>
    <div class="gallery">
        <div class="car-card">
            <img src="IMG-20260606-WA0021.jpg" class="car-img" alt="هايلوكس">
            <h3>تويوتا هايلوكس</h3>
        </div>
        <div class="car-card">
            <img src="1780666942767.jpg" class="car-img" alt="برادو">
            <h3>تويوتا برادو</h3>
        </div>
    </div>

    <!-- قسم الاستيراد (الصور المخصصة فقط) -->
    <h2 class="section-title">طلبات الاستيراد</h2>
    <div class="gallery">
        <div class="car-card">
            <img src="1780666861258.jpg" class="car-img" alt="شاص">
            <h3>لاندكروزر شاص</h3>
        </div>
    </div>

</body>
</html>
